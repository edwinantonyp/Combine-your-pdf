<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>PDF Combiner Pro - Mobile & Desktop</title>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<style>
  :root{--bg:#0f0f10;--panel:#18181b;--border:#27272a;--accent:#6366f1;--text:#e4e4e7}
  *{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui}
  body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:var(--panel);position:sticky;top:0;z-index:10}
.logo{font-weight:800;font-size:18px}.logo span{color:var(--accent)}
.main{display:flex;flex:1;overflow:hidden}
.left{width:360px;border-right:1px solid var(--border);padding:16px;overflow-y:auto;background:var(--panel)}
.center{flex:1;background:#000;display:flex;flex-direction:column;position:relative}
.drop{border:2px dashed #3f3f46;border-radius:12px;padding:28px;text-align:center;cursor:pointer}
.drop.dragover{border-color:var(--accent);background:rgba(99,102,241,0.1)}
.btn{width:100%;background:var(--accent);color:#fff;border:none;padding:14px;border-radius:10px;font-weight:600;cursor:pointer;margin-top:10px;font-size:15px}
.btn.secondary{background:#27272a}.btn.green{background:#10b981}
.file-item{background:#0f0f10;border:1px solid var(--border);border-radius:10px;padding:12px;margin:10px 0;display:flex;justify-content:space-between;align-items:center}
.toolbar{height:50px;background:var(--panel);display:flex;align-items:center;padding:0 10px;gap:6px;border-bottom:1px solid var(--border);overflow-x:auto;white-space:nowrap}
.toolbar button{padding:8px 12px;background:#27272a;border:none;color:#fff;border-radius:8px;cursor:pointer;font-size:14px}
.pdf-view{flex:1;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:12px;touch-action:pan-y}
.pdf-view canvas{max-width:100%;height:auto;background:#fff;border-radius:4px;box-shadow:0 0 20px rgba(0,0,0,0.6)}

  /* MOBILE */
  @media(max-width: 900px){
   .main{flex-direction:column}
   .left{width:100%;border-right:none;border-bottom:1px solid var(--border);max-height:50vh}
   .center{height:50vh}
    header{flex-wrap:wrap;gap:8px}
   .desktop-only{display:none}
  }
</style>
</head>
<body>

<header>
  <div class="logo">PDF<span>Combiner</span></div>
  <div style="display:flex;gap:8px">
    <button class="btn secondary" style="width:auto;padding:10px 14px;margin:0" onclick="clearAll()">Clear</button>
    <button class="btn" style="width:auto;padding:10px 14px;margin:0" onclick="combineAndView()">Combine & View</button>
    <button class="btn green" style="width:auto;padding:10px 14px;margin:0" onclick="downloadCombined()">Download</button>
  </div>
</header>

<div class="main">
  <div class="left">
    <div class="drop" id="dropzone" onclick="document.getElementById('fileInput').click()">
      <b style="font-size:16px">📄 Drop PDFs Here</b><br>
      <span style="font-size:13px;color:#a1a1aa">Tap to browse on mobile</span>
      <input type="file" id="fileInput" multiple accept=".pdf" style="display:none">
    </div>
    <div id="fileList"></div>
    <div id="total" style="font-size:13px;color:#a1a1aa;margin-top:10px">0 files</div>
    <input id="outName" value="combined.pdf" style="width:100%;padding:12px;background:#09090b;border:1px solid #27272a;color:#fff;border-radius:8px;margin-top:12px">
  </div>

  <div class="center">
    <div class="toolbar">
      <button onclick="prevPage()">← Prev</button>
      <button onclick="nextPage()">Next →</button>
      <span id="pageInfo" style="font-size:13px;margin-left:8px">No PDF</span>
      <button onclick="zoomOut()" style="margin-left:auto">-</button>
      <button onclick="zoomIn()">+</button>
    </div>
    <div class="pdf-view" id="pdfView">
      <div style="text-align:center;color:#666;margin-top:60px;padding:20px">
        <div style="font-size:48px">👁️</div>
        <p>Combined PDF will appear here<br><span style="font-size:12px">Swipe left/right to change pages on mobile</span></p>
      </div>
    </div>
  </div>
</div>

<script>
const { PDFDocument } = PDFLib;
let files=[], combinedBlob=null, viewerPdf=null, currentPage=1, zoom=1.1;

const dropzone=document.getElementById('dropzone');
const fileInput=document.getElementById('fileInput');

['dragenter','dragover'].forEach(e=>dropzone.addEventListener(e,ev=>{ev.preventDefault();dropzone.classList.add('dragover')}));
dropzone.addEventListener('dragleave',()=>dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop',e=>{e.preventDefault();dropzone.classList.remove('dragover');handleFiles(e.dataTransfer.files)});
fileInput.onchange=e=>handleFiles(e.target.files);

async function handleFiles(list){
  for(let f of list){
    if(f.type!=='application/pdf') continue;
    const buf=await f.arrayBuffer();
    const doc=await PDFDocument.load(buf);
    files.push({file:f, buffer:buf, pages:doc.getPageCount()});
  }
  renderList();
}

function renderList(){
  const list=document.getElementById('fileList'); list.innerHTML='';
  files.forEach((f,i)=>{
    list.innerHTML+=`<div class="file-item"><div><b style="font-size:13px">${f.file.name}</b><br><span style="font-size:12px;color:#a1a1aa">${f.pages} pages</span></div>
    <div style="display:flex;gap:4px"><button onclick="move(${i},-1)" style="background:#27272a;border:none;color:#fff;padding:8px;border-radius:6px">↑</button>
    <button onclick="move(${i},1)" style="background:#27272a;border:none;color:#fff;padding:8px;border-radius:6px">↓</button>
    <button onclick="removeAt(${i})" style="background:#7f1d1d;border:none;color:#fff;padding:8px;border-radius:6px">✕</button></div></div>`;
  });
  document.getElementById('total').innerText=`${files.length} files, ${files.reduce((a,b)=>a+b.pages,0)} pages`;
}
function move(i,dir){if((i==0&&dir==-1)||(i==files.length-1&&dir==1))return;[files[i],files[i+dir]]=[files[i+dir],files[i]];renderList();}
function removeAt(i){files.splice(i,1);renderList();}
function clearAll(){files=[];renderList();document.getElementById('pdfView').innerHTML='<div style="text-align:center;color:#666;margin-top:60px">Cleared</div>';combinedBlob=null;}

async function combineAndView(){
  if(files.length==0) return alert("Add PDFs first");
  const merged=await PDFDocument.create();
  for(let f of files){
    const pdf=await PDFDocument.load(f.buffer);
    const pages=await merged.copyPages(pdf, pdf.getPageIndices());
    pages.forEach(p=>merged.addPage(p));
  }
  const bytes=await merged.save();
  combinedBlob=new Blob([bytes],{type:'application/pdf'});
  await loadViewer(await combinedBlob.arrayBuffer());
}

async function loadViewer(buffer){
  viewerPdf=await pdfjsLib.getDocument({data:buffer}).promise;
  currentPage=1; renderPage(currentPage);
}

async function renderPage(num){
  if(!viewerPdf) return;
  const page=await viewerPdf.getPage(num);
  const viewport=page.getViewport({scale: zoom});
  const canvas=document.createElement('canvas');
  canvas.width=viewport.width; canvas.height=viewport.height;
  await page.render({canvasContext:canvas.getContext('2d'), viewport}).promise;
  const view=document.getElementById('pdfView'); view.innerHTML=''; view.appendChild(canvas);
  document.getElementById('pageInfo').innerText=`${num} / ${viewerPdf.numPages}`;
}

function nextPage(){if(viewerPdf&&currentPage<viewerPdf.numPages){currentPage++;renderPage(currentPage);}}
function prevPage(){if(viewerPdf&&currentPage>1){currentPage--;renderPage(currentPage);}}
function zoomIn(){zoom+=0.2;renderPage(currentPage);}
function zoomOut(){zoom=Math.max(0.6,zoom-0.2);renderPage(currentPage);}
function downloadCombined(){if(!combinedBlob) return alert("Combine first"); const a=document.createElement('a'); a.href=URL.createObjectURL(combinedBlob); a.download=document.getElementById('outName').value||'combined.pdf'; a.click();}

// Mobile swipe
let startX=0;
document.getElementById('pdfView').addEventListener('touchstart',e=>startX=e.touches[0].clientX);
document.getElementById('pdfView').addEventListener('touchend',e=>{
  const diff=e.changedTouches[0].clientX-startX;
  if(Math.abs(diff)>50){ if(diff<0) nextPage(); else prevPage(); }
});
</script>
</body>
</html>
