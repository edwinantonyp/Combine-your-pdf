<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PDF Combiner Pro - With Viewer</title>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<style>
  :root{--bg:#0f0f10;--panel:#18181b;--border:#27272a;--accent:#6366f1;--text:#e4e4e7;--muted:#a1a1aa}
  *{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Segoe UI}
  body{background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh}
  header{height:60px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;justify-content:space-between;background:var(--panel)}
.logo{font-weight:800;font-size:20px}.logo span{color:var(--accent)}
.main{display:flex;flex:1;overflow:hidden}
.left{width:340px;border-right:1px solid var(--border);padding:16px;overflow-y:auto;background:var(--panel)}
.center{flex:1;background:#000;display:flex;flex-direction:column}
.drop{border:2px dashed #3f3f46;border-radius:12px;padding:24px;text-align:center;cursor:pointer}
.drop.dragover{border-color:var(--accent);background:rgba(99,102,241,0.1)}
.btn{width:100%;background:var(--accent);color:#fff;border:none;padding:12px;border-radius:8px;font-weight:600;cursor:pointer;margin-top:10px}
.btn.secondary{background:#27272a}
.file-item{background:#0f0f10;border:1px solid var(--border);border-radius:8px;padding:10px;margin:8px 0;display:flex;justify-content:space-between;align-items:center}
.file-item span{font-size:13px}
.viewer-toolbar{height:48px;background:var(--panel);display:flex;align-items:center;padding:0 12px;gap:8px;border-bottom:1px solid var(--border)}
.viewer-toolbar button{padding:6px 10px;background:#27272a;border:none;color:#fff;border-radius:6px;cursor:pointer}
.pdf-view{flex:1;overflow:auto;display:flex;justify-content:center;padding:20px}
.pdf-view canvas{background:#fff;border-radius:4px;box-shadow:0 0 20px rgba(0,0,0,0.5)}
  #total{font-size:13px;color:var(--muted);margin-top:10px}
</style>
</head>
<body>

<header>
  <div class="logo">PDF<span>Combiner</span> + Viewer</div>
  <div style="display:flex;gap:8px">
    <button class="btn secondary" style="width:auto" onclick="clearAll()">Clear</button>
    <button class="btn" style="width:auto" onclick="combineAndView()">Combine & View</button>
    <button class="btn" style="width:auto;background:#10b981" onclick="downloadCombined()">Download</button>
  </div>
</header>

<div class="main">
  <div class="left">
    <div class="drop" id="dropzone" onclick="document.getElementById('fileInput').click()">
      <b>Drop PDFs here</b><br><span style="font-size:12px;color:#a1a1aa">or click to browse</span>
      <input type="file" id="fileInput" multiple accept=".pdf" style="display:none">
    </div>
    <div id="fileList"></div>
    <div id="total">0 files, 0 pages</div>
    <label style="font-size:12px;margin-top:16px;display:block">Output Name</label>
    <input id="outName" value="combined.pdf" style="width:100%;padding:8px;background:#09090b;border:1px solid var(--border);color:#fff;border-radius:6px;margin-top:4px">
  </div>

  <div class="center">
    <div class="viewer-toolbar">
      <button onclick="prevPage()">← Prev</button>
      <button onclick="nextPage()">Next →</button>
      <span id="pageInfo" style="font-size:13px">No PDF loaded</span>
      <div style="margin-left:auto;display:flex;gap:6px">
        <button onclick="zoomOut()">- Zoom</button>
        <button onclick="zoomIn()">+ Zoom</button>
      </div>
    </div>
    <div class="pdf-view" id="pdfView">
      <p style="color:#666;margin-top:100px">Combined PDF will appear here after you click "Combine & View"</p>
    </div>
  </div>
</div>

<script>
const { PDFDocument } = PDFLib;
let files = [];
let combinedBlob = null;
let viewerPdf = null;
let currentPage = 1;
let zoom = 1.2;

const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');

['dragenter','dragover'].forEach(e=>dropzone.addEventListener(e,ev=>{ev.preventDefault();dropzone.classList.add('dragover')}));
dropzone.addEventListener('dragleave',()=>dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop',e=>{e.preventDefault();dropzone.classList.remove('dragover');handleFiles(e.dataTransfer.files)});
fileInput.onchange=e=>handleFiles(e.target.files);

async function handleFiles(list){
  for(let f of list){
    if(f.type!=='application/pdf') continue;
    const buf = await f.arrayBuffer();
    const doc = await PDFDocument.load(buf);
    files.push({file:f, buffer:buf, pages:doc.getPageCount()});
  }
  renderList();
}

function renderList(){
  const list = document.getElementById('fileList');
  list.innerHTML='';
  files.forEach((f,i)=>{
    list.innerHTML+=`<div class="file-item"><span>${i+1}. ${f.file.name} (${f.pages})</span>
    <span><button onclick="move(${i},-1)" style="background:#27272a;border:none;color:#fff;padding:4px;border-radius:4px">↑</button>
    <button onclick="move(${i},1)" style="background:#27272a;border:none;color:#fff;padding:4px;border-radius:4px">↓</button>
    <button onclick="removeAt(${i})" style="background:#7f1d1d;border:none;color:#fff;padding:4px;border-radius:4px">✕</button></span></div>`;
  });
  const totalPages = files.reduce((a,b)=>a+b.pages,0);
  document.getElementById('total').innerText=`${files.length} files, ${totalPages} pages`;
}

function move(i,dir){ if((i==0&&dir==-1)||(i==files.length-1&&dir==1))return; [files[i],files[i+dir]]=[files[i+dir],files[i]]; renderList(); }
function removeAt(i){ files.splice(i,1); renderList(); }
function clearAll(){ files=[]; renderList(); document.getElementById('pdfView').innerHTML='<p style="color:#666;margin-top:100px">Cleared</p>'; combinedBlob=null; }

async function combineAndView(){
  if(files.length==0) return alert("Add PDFs first");
  const merged = await PDFDocument.create();
  for(let f of files){
    const pdf = await PDFDocument.load(f.buffer);
    const pages = await merged.copyPages(pdf, pdf.getPageIndices());
    pages.forEach(p=>merged.addPage(p));
  }
  const bytes = await merged.save();
  combinedBlob = new Blob([bytes], {type:'application/pdf'});
  const buf = await combinedBlob.arrayBuffer();
  await loadViewer(buf);
}

async function loadViewer(buffer){
  viewerPdf = await pdfjsLib.getDocument({data:buffer}).promise;
  currentPage=1;
  renderPage(currentPage);
}

async function renderPage(num){
  if(!viewerPdf) return;
  const page = await viewerPdf.getPage(num);
  const viewport = page.getViewport({scale: zoom});
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width; canvas.height = viewport.height;
  const ctx = canvas.getContext('2d');
  await page.render({canvasContext:ctx, viewport}).promise;
  const view = document.getElementById('pdfView');
  view.innerHTML=''; view.appendChild(canvas);
  document.getElementById('pageInfo').innerText = `Page ${num} / ${viewerPdf.numPages} - Combined PDF`;
}

function nextPage(){ if(viewerPdf && currentPage < viewerPdf.numPages){ currentPage++; renderPage(currentPage); } }
function prevPage(){ if(viewerPdf && currentPage > 1){ currentPage--; renderPage(currentPage); } }
function zoomIn(){ zoom+=0.2; renderPage(currentPage); }
function zoomOut(){ zoom=Math.max(0.5, zoom-0.2); renderPage(currentPage); }

function downloadCombined(){
  if(!combinedBlob) return alert("Click 'Combine & View' first");
  const a=document.createElement('a');
  a.href=URL.createObjectURL(combinedBlob);
  a.download=document.getElementById('outName').value || 'combined.pdf';
  a.click();
}
</script>
</body>
</html>
